name: Fidelly Prospection V9 New-First

on:
  workflow_dispatch:
    inputs:
      zones:
        description: 'Villes / arrondissements séparés par |'
        required: true
        default: 'Lyon'
      keywords:
        description: 'Activités séparées par |'
        required: true
        default: 'restaurant|bar|caviste|coiffeur|institut de beauté|fleuriste|animalerie|boulangerie|pâtisserie|épicerie|primeur|boucherie|poissonnerie|librairie|magasin de vêtements|chaussures|bijouterie|opticien|photographe|salle de sport|spa|tatoueur|toilettage|CBD'
      target_new_per_city:
        description: 'Objectif de NOUVEAUX prospects uniques par ville'
        required: true
        default: '100'
      pages:
        description: 'Pages Annuaire Entreprises par activité'
        required: true
        default: '5'
      discovery_multiplier:
        description: 'Largeur du vivier (8 = cherche jusqu’à ~8x la cible)'
        required: true
        default: '8'
      max_enrich_per_run:
        description: 'Maximum de fiches enrichies par ville et par run'
        required: true
        default: '100'
      checkpoint_every:
        description: 'Envoi Google Sheets toutes les N fiches enrichies'
        required: true
        default: '5'
      force_refresh:
        description: 'Forcer le retraitement des anciens prospects'
        required: true
        type: boolean
        default: false

concurrency:
  group: fidelly-prospection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.matrix.outputs.zones }}
    steps:
      - name: Build city matrix
        id: matrix
        shell: bash
        env:
          ZONES: ${{ github.event.inputs.zones }}
        run: |
          python - <<'PY'
          import json, os
          ignored = {'zone','zones','ville','villes'}
          zones, seen = [], set()
          for raw in os.environ['ZONES'].split('|'):
              z = raw.strip()
              if not z or z.lower() in ignored:
                  continue
              key = z.casefold()
              if key not in seen:
                  seen.add(key)
                  zones.append(z)
          if not zones:
              raise SystemExit('Aucune ville valide')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('zones=' + json.dumps(zones, ensure_ascii=False) + '\n')
          print('Villes:', zones)
          PY

  prospect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        zone: ${{ fromJSON(needs.prepare.outputs.zones) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run V9 New-First
        env:
          ZONE: ${{ matrix.zone }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
          TARGET_NEW: ${{ github.event.inputs.target_new_per_city }}
          PAGES: ${{ github.event.inputs.pages }}
          DISCOVERY_MULTIPLIER: ${{ github.event.inputs.discovery_multiplier }}
          MAX_ENRICH: ${{ github.event.inputs.max_enrich_per_run }}
          CHECKPOINT_EVERY: ${{ github.event.inputs.checkpoint_every }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          EXTRA_ARGS=""
          if [ "$FORCE_REFRESH" = "true" ]; then
            EXTRA_ARGS="--force-refresh"
          fi

          python fidelly_prospect_finder_v9_new_first.py             --zones-pipe "$ZONE"             --keywords-pipe "$KEYWORDS"             --pages "$PAGES"             --target-new-per-zone "$TARGET_NEW"             --discovery-multiplier "$DISCOVERY_MULTIPLIER"             --max-enrich-per-run "$MAX_ENRICH"             --checkpoint-every "$CHECKPOINT_EVERY"             --max-runtime-minutes 160             --output fidelly_prospects.csv             --push-sheets             $EXTRA_ARGS

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f fidelly_prospects.summary.json ]; then
            echo '## Fidelly V9 — New-First' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat fidelly_prospects.summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep CSV, summary and pending checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelly-v9-${{ strategy.job-index }}
          path: |
            fidelly_prospects.csv
            fidelly_prospects.summary.json
            fidelly_prospects.pending.json
          if-no-files-found: ignore
          retention-days: 30
