name: Fidelly Prospection V7 Resilient

on:
  workflow_dispatch:
    inputs:
      zones:
        description: 'Villes séparées par |'
        required: true
        default: 'Bourges|Châteauroux|Vierzon|Romorantin-Lanthenay|Saint-Amand-Montrond'
      keywords:
        description: 'Activités séparées par | (les espaces sont conservés)'
        required: true
        default: 'restaurant|café|bar|caviste|coiffeur|barbier|institut de beauté|CBD|fleuriste|animalerie|boulangerie'
      max_prospects_per_city:
        description: 'Maximum par ville'
        required: true
        default: '50'
      pages:
        description: 'Pages Annuaire Entreprises par activité'
        required: true
        default: '2'
      checkpoint_every:
        description: 'Envoi Google Sheets toutes les N fiches'
        required: true
        default: '5'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.matrix.outputs.zones }}
    steps:
      - name: Build city matrix
        id: matrix
        shell: bash
        env:
          ZONES: ${{ github.event.inputs.zones }}
        run: |
          python - <<'PY'
          import json, os
          ignored = {'zone','zones','ville','villes'}
          zones = []
          seen = set()
          for raw in os.environ['ZONES'].split('|'):
              z = raw.strip()
              if not z or z.lower() in ignored:
                  continue
              k = z.casefold()
              if k not in seen:
                  seen.add(k)
                  zones.append(z)
          if not zones:
              raise SystemExit('Aucune ville valide')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('zones=' + json.dumps(zones, ensure_ascii=False) + '\n')
          print('Villes:', zones)
          PY

  prospect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        zone: ${{ fromJSON(needs.prepare.outputs.zones) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run resilient city scan
        env:
          ZONE: ${{ matrix.zone }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
          MAX_PROSPECTS: ${{ github.event.inputs.max_prospects_per_city }}
          PAGES: ${{ github.event.inputs.pages }}
          CHECKPOINT_EVERY: ${{ github.event.inputs.checkpoint_every }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          python fidelly_prospect_finder_v7_resilient.py \
            --zones-pipe "$ZONE" \
            --keywords-pipe "$KEYWORDS" \
            --pages "$PAGES" \
            --max-prospects-per-zone "$MAX_PROSPECTS" \
            --checkpoint-every "$CHECKPOINT_EVERY" \
            --max-runtime-minutes 160 \
            --output fidelly_prospects.csv \
            --push-sheets

      - name: Keep CSV and pending checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelly-prospects-${{ strategy.job-index }}
          path: |
            fidelly_prospects.csv
            fidelly_prospects.pending.json
          if-no-files-found: ignore
          retention-days: 30
