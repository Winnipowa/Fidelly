name: Fidelly Prospection V9.2 Fast Discovery

on:
  workflow_dispatch:
    inputs:
      zones:
        description: 'Villes / arrondissements séparés par |'
        required: true
        default: 'Lyon'
      all_businesses:
        description: 'Scanner tous les métiers (732 activités NAF)'
        required: true
        type: boolean
        default: true
      keywords:
        description: 'Sinon: activités séparées par |'
        required: false
        default: ''
      target_new_per_city:
        description: 'Objectif de NOUVEAUX prospects uniques par ville'
        required: true
        default: '100'
      pages:
        description: 'Pages Annuaire Entreprises par activité (mode ciblé)'
        required: true
        default: '3'
      max_enrich_per_run:
        description: 'Maximum de profils prioritaires enrichis par ville'
        required: true
        default: '40'
      checkpoint_every:
        description: 'Envoi Google Sheets toutes les N fiches enrichies'
        required: true
        default: '10'
      max_per_naf:
        description: 'Mode tous métiers: max candidats retenus par code NAF'
        required: true
        default: '4'
      workers:
        description: 'Enrichissements web parallèles (4-12 recommandé)'
        required: true
        default: '8'
      fast_timeout:
        description: 'Timeout web/crawl en secondes'
        required: true
        default: '7'
      enrich_tier_b:
        description: 'Enrichir aussi les profils B après les profils A'
        required: true
        type: boolean
        default: false

concurrency:
  group: fidelly-prospection
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.matrix.outputs.zones }}
    steps:
      - name: Build city matrix
        id: matrix
        shell: bash
        env:
          ZONES: ${{ github.event.inputs.zones }}
        run: |
          python - <<'PY'
          import json, os
          ignored = {'zone','zones','ville','villes'}
          zones, seen = [], set()
          for raw in os.environ['ZONES'].split('|'):
              z = raw.strip()
              if not z or z.lower() in ignored:
                  continue
              key = z.casefold()
              if key not in seen:
                  seen.add(key)
                  zones.append(z)
          if not zones:
              raise SystemExit('Aucune ville valide')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('zones=' + json.dumps(zones, ensure_ascii=False) + '\n')
          print('Villes:', zones)
          PY

  prospect:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        zone: ${{ fromJSON(needs.prepare.outputs.zones) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build full NAF taxonomy
        if: ${{ github.event.inputs.all_businesses == 'true' }}
        run: python build_business_categories.py -o business_categories.json

      - name: Run V9.2 Fast Discovery
        env:
          ZONE: ${{ matrix.zone }}
          ALL_BUSINESSES: ${{ github.event.inputs.all_businesses }}
          KEYWORDS: ${{ github.event.inputs.keywords }}
          TARGET_NEW: ${{ github.event.inputs.target_new_per_city }}
          PAGES: ${{ github.event.inputs.pages }}
          MAX_ENRICH: ${{ github.event.inputs.max_enrich_per_run }}
          CHECKPOINT_EVERY: ${{ github.event.inputs.checkpoint_every }}
          MAX_PER_NAF: ${{ github.event.inputs.max_per_naf }}
          WORKERS: ${{ github.event.inputs.workers }}
          FAST_TIMEOUT: ${{ github.event.inputs.fast_timeout }}
          ENRICH_TIER_B: ${{ github.event.inputs.enrich_tier_b }}
          SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
          SHEETS_WEBHOOK_TOKEN: ${{ secrets.SHEETS_WEBHOOK_TOKEN }}
        shell: bash
        run: |
          EXTRA_ARGS=""

          if [ "$ALL_BUSINESSES" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --all-businesses --business-categories business_categories.json --max-per-naf $MAX_PER_NAF"
          elif [ -z "${KEYWORDS// }" ]; then
            echo "Erreur: renseigne keywords ou active 'Scanner tous les métiers'."
            exit 2
          fi

          if [ "$ENRICH_TIER_B" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --enrich-tier-b"
          fi

          python fidelly_prospect_finder_v9_2_fast.py \
            --zones-pipe "$ZONE" \
            --keywords-pipe "$KEYWORDS" \
            --pages "$PAGES" \
            --target-new-per-zone "$TARGET_NEW" \
            --max-enrich-per-run "$MAX_ENRICH" \
            --checkpoint-every "$CHECKPOINT_EVERY" \
            --workers "$WORKERS" \
            --fast-timeout "$FAST_TIMEOUT" \
            --max-runtime-minutes 75 \
            --output fidelly_prospects.csv \
            --push-sheets \
            $EXTRA_ARGS

      - name: Job summary
        if: always()
        shell: bash
        run: |
          if [ -f fidelly_prospects.summary.json ]; then
            echo '## Fidelly V9.2 — Fast Discovery' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat fidelly_prospects.summary.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep CSV, summary and pending checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fidelly-v9.2-${{ strategy.job-index }}
          path: |
            fidelly_prospects.csv
            fidelly_prospects.summary.json
            fidelly_prospects.pending.json
            business_categories.json
          if-no-files-found: ignore
          retention-days: 30
